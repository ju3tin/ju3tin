name: Update Coding Experience

on:
  schedule:
    - cron: "0 0 1 1 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Calculate coding years
        run: |
          YEAR=$(date +%Y)
          YEARS=$((YEAR - 2001))

          cat > coding-years.json << EOF
          {
            "schemaVersion": 1,
            "label": "years of coding",
            "message": "${YEARS}+ years",
            "color": "blue"
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coding-years.json
          git diff --cached --quiet || git commit -m "Update coding experience"
          git push
